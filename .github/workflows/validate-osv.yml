name: "Validate OSV"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: Validate
      run: make validate

  check-preprocess:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: Check Preprocess (Push)
      run: make preprocess
      if: ${{ github.event_name != 'pull_request' }}
    - name: Check Preprocess (Pull Request)
      run: make preprocess-strict
      if: ${{ github.event_name == 'pull_request' }}

  check-schema:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: Checkout ossf/osv-schema
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ossf/osv-schema
        ref: 3d4ec5f63794981c27f6c6c6d0d0017dc4bbd475
        path: osv-schema
    - name: Loosen ID check
      # This check allows for "id" to missing or an empty string, which allows
      # PRs for new OSV reports to pass validation. If ID is not empty it will
      # be validated as per the schema.
      run: |
        yq -p=json -o=json '.properties.id |= { "oneOf" : [ . , { "type": "string", "pattern": "^$" } ] } | .required |= filter(. != "id")' osv-schema/validation/schema.json > schema.json
    - name: Check against schema
      run: |
        go install github.com/santhosh-tekuri/jsonschema/cmd/jv@v0.7.0
        find osv -name "MAL-*.json" -exec jv schema.json {} +

  no-deletes:
    runs-on: ubuntu-latest
    if: ${{ github.base_ref != '' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # Report IDs match filenames, so the check only needs the git trees of
        # the PR merge commit (HEAD) and its first parent, the base branch
        # (HEAD^1). Fetch both commits but keep the working tree tiny.
        fetch-depth: 2
        sparse-checkout: config
        sparse-checkout-cone-mode: true
    - name: Check for deleted reports
      run: |
        # List the OSV IDs present in a tree by filename, without touching
        # the working directory.
        ids() {
          git ls-tree -r --name-only "$1" -- osv/ \
            | sed -nE 's|.*/(MAL-[0-9]+-[0-9]+)\.json$|\1|p' \
            | sort -u
        }

        # IDs present in the base branch but absent from this branch.
        REMOVED_IDS=$(comm -23 <(ids HEAD^1) <(ids HEAD) | paste -sd',' -)
        echo "::debug ::Result of check = '$REMOVED_IDS'"

        if [ -z "$REMOVED_IDS" ]; then
          echo "::notice ::No removed reports detected."
        else
          echo "### Deleted Reports Detected" >> $GITHUB_STEP_SUMMARY
          echo "IDs removed: $REMOVED_IDS" >> $GITHUB_STEP_SUMMARY
          echo "::error ::Report(s) deleted."
          exit 1
        fi
